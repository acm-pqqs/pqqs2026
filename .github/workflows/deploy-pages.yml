name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production site
        uses: actions/checkout@v4
        with:
          ref: main
          path: site

      - name: Checkout staging preview
        uses: actions/checkout@v4
        with:
          ref: staging
          path: staging-src

      - name: Assemble site with staging preview
        run: |
          rm -rf site/staging
          mkdir -p site/staging
          rsync -a staging-src/ site/staging/ \
            --exclude .git \
            --exclude .github

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
